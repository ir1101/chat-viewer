<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16131a" media="(prefers-color-scheme: dark)">
<title>Chat by Date</title>
<style>
:root{
  --bg:#fbf7f4; --surface:#ffffff; --surface-2:#f3ede8; --line:#e8e0d9;
  --text:#211c20; --muted:#857a80; --accent:#c2416b; --accent-soft:#f9e3ea;
  --me:#c2416b; --me-text:#fff; --them:#ffffff; --them-text:#211c20;
  --heat-1:#f7d9e2; --heat-2:#eba5ba; --heat-3:#d86b8f; --heat-4:#b12f5b;
  --shadow:0 1px 2px rgba(60,30,40,.08);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16131a; --surface:#221e26; --surface-2:#2b2630; --line:#36303b;
    --text:#f1ecef; --muted:#9d929a; --accent:#f07ba0; --accent-soft:#3b2530;
    --me:#b8365f; --me-text:#fff; --them:#2b2630; --them-text:#f1ecef;
    --heat-1:#4a2836; --heat-2:#78334f; --heat-3:#b2416b; --heat-4:#f07ba0;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 8px) 12px 8px}
.who{display:flex;align-items:center;gap:10px;padding:0 4px 8px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f6a3b9,#c2416b);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.who h1{font-size:16px;margin:0;font-weight:650;line-height:1.2}
.who p{margin:0;font-size:12px;color:var(--muted)}
.datebar{display:flex;align-items:center;gap:6px}
.nav{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);flex:none}
.nav:disabled{opacity:.35}
.nav svg{width:20px;height:20px}
.datebtn{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.datebtn strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebtn span{font-size:12px;color:var(--muted);white-space:nowrap}
.datebtn svg{width:16px;height:16px;color:var(--accent);flex:none}

/* messages */
main{flex:1;padding:14px 12px calc(var(--safe-b) + 24px);touch-action:pan-y}
.daypos{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 14px}
.row{display:flex;flex-direction:column;align-items:flex-start;margin-top:2px}
.row.me{align-items:flex-end}
.row.first{margin-top:12px}
.name{font-size:12px;color:var(--muted);margin:0 0 3px 12px}
.bubble{max-width:82%;padding:8px 12px;border-radius:18px;background:var(--them);color:var(--them-text);box-shadow:var(--shadow);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.me .bubble{background:var(--me);color:var(--me-text);border-color:transparent}
.row:not(.last) .bubble{border-bottom-left-radius:6px}
.me:not(.last) .bubble{border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bubble.emoji{background:none;border:0;box-shadow:none;font-size:34px;line-height:1.15;padding:2px 4px}
.bubble.muted{font-style:italic;opacity:.75}
.bubble a{color:inherit}
.meta{font-size:11px;color:var(--muted);margin:3px 8px 0;display:flex;gap:6px;align-items:center}
.reacts{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:13px;margin-top:-6px;margin-left:10px;position:relative;z-index:1}
.me .reacts{margin-left:0;margin-right:10px}
.card{max-width:82%;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);color:var(--text)}
.card .top{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:13px;font-weight:600}
.card .top i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#feda75,#d62976,#4f5bd5);flex:none}
.card .cap{padding:6px 12px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.card.open .cap{-webkit-line-clamp:unset}
.card .more{font-size:12px;color:var(--muted);padding:2px 12px 0}
.card a.open-ig{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 12px 12px;height:38px;border-radius:10px;background:var(--surface-2);color:var(--text);text-decoration:none;font-size:13px;font-weight:600}
.card .kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px 0}
.photo{max-width:70%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.photo img{display:block;max-width:100%}
.photo .missing{padding:22px 18px;font-size:13px;color:var(--muted);text-align:center}
.system{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 12px;margin:12px auto 0;text-align:center;max-width:90%}
.hit .bubble,.hit .card{outline:3px solid var(--accent);outline-offset:2px;transition:outline-color 1.5s ease 1.5s}
.hit.fade .bubble,.hit.fade .card{outline-color:transparent}
.swipehint{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet-head{padding:calc(var(--safe-t) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-head .bar{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto 10px}
.sheet-head h2{font-size:17px;margin:0;font-weight:650}
.close{height:40px;padding:0 14px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:14px}
.search{max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;padding:0 40px 0 38px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;color:var(--muted)}
.search .clr{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:8px;color:var(--muted);display:none;font-size:18px}
.search.has .clr{display:block}
.quick{display:flex;gap:8px;max-width:560px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.quick button{height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.sheet-body{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(var(--safe-b) + 20px)}
.inner{max-width:560px;margin:0 auto}
.month{padding-top:18px}
.month h3{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:0 4px 8px;font-weight:650}
.month h3 span{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:14px;color:var(--muted);opacity:.45;position:relative}
.d.has{opacity:1;color:var(--text);background:var(--heat-1);font-weight:600}
.d.h2{background:var(--heat-2)}
.d.h3{background:var(--heat-3);color:#fff}
.d.h4{background:var(--heat-4);color:#fff}
.d.cur{outline:2.5px solid var(--text);outline-offset:1px}
.d small{position:absolute;bottom:3px;font-size:9px;font-weight:500;opacity:.8}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin:12px 4px 0}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.results{padding-top:8px}
.res{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.res .when{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.res .txt{margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.res mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.count{font-size:12px;color:var(--muted);margin:10px 4px 0}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div><h1 id="title"></h1><p id="summary"></p></div>
    </div>
    <div class="datebar">
      <button class="nav" id="prev" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="datebtn" id="openSheet" aria-label="Pick a date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <strong id="dayLabel"></strong><span id="dayCount"></span>
      </button>
      <button class="nav" id="next" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="msgs"></main>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <div class="bar"><h2>Jump to a date</h2><button class="close" id="closeSheet">Done</button></div>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search messages" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="Clear search">✕</button>
    </div>
    <div class="quick">
      <button data-go="first">First chat</button>
      <button data-go="last">Latest chat</button>
      <button data-go="busiest">Busiest day</button>
      <button data-go="random">Random day</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"><div class="inner" id="cal"></div><div class="inner results" id="results" hidden></div></div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ME = "Ishu";
const msgs = DATA.messages;
const byDay = new Map();
msgs.forEach((m, i) => { m.idx = i; const d = m.t.slice(0, 10); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(m); });
const days = [...byDay.keys()];
const $ = id => document.getElementById(id);
let cur = null;

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const parse = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd); };
const short = d => { const x = parse(d); return `${DOW[x.getDay()]}, ${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}`; };
const time = t => { let [h, mi] = t.slice(11).split(':').map(Number); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return `${h}:${String(mi).padStart(2, '0')} ${ap}`; };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const isEmoji = s => s.length <= 12 && /^[\p{Extended_Pictographic}‍️\s]+$/u.test(s);

// header
$('title').textContent = DATA.title;
$('avatar').textContent = [...DATA.title][0] || '?';
$('summary').textContent = `${msgs.length.toLocaleString()} messages · ${days.length} days · ${MON[parse(days[0]).getMonth()]} ${parse(days[0]).getFullYear()} – ${MON[parse(days.at(-1)).getMonth()]} ${parse(days.at(-1)).getFullYear()}`;

function renderDay(d, hitIdx) {
  cur = d;
  const list = byDay.get(d), i = days.indexOf(d);
  $('dayLabel').textContent = short(d);
  $('dayCount').textContent = `${list.length}`;
  $('prev').disabled = i === 0; $('next').disabled = i === days.length - 1;
  history.replaceState(null, '', '#' + d);
  try { localStorage.setItem('chatDay', d); } catch (e) {}

  let html = `<div class="daypos">Day ${i + 1} of ${days.length} · ${list.length} message${list.length > 1 ? 's' : ''}</div>`;
  list.forEach((m, k) => {
    const prev = list[k - 1], next = list[k + 1];
    if (m.s === 'Meta AI' || (!m.x && !m.i && !m.sh)) {
      html += `<div class="system">${m.s === 'Meta AI' ? 'Meta AI joined the chat' : esc(m.s) + ' · unsupported message'} · ${time(m.t)}</div>`; return;
    }
    const me = m.s === ME;
    const first = !prev || prev.s !== m.s, last = !next || next.s !== m.s;
    let inner = '';
    const imgs = m.i || [];
    const share = m.sh && !imgs.includes(m.sh.u) ? m.sh : null;
    const generic = m.x && / sent an attachment\.$/.test(m.x);
    if (m.x && !(generic && (share || imgs.length))) {
      if (generic) inner += `<div class="bubble muted">📎 Attachment</div>`;
      else inner += `<div class="bubble${isEmoji(m.x) ? ' emoji' : ''}">${linkify(m.x)}</div>`;
    }
    imgs.forEach(src => {
      inner += `<div class="photo"><img src="${esc(src)}" alt="Photo" loading="lazy" onerror="this.outerHTML='<div class=missing>🖼️ Photo<br>(not in this folder)</div>'"></div>`;
    });
    if (share) {
      const isReel = /\/reel\//.test(share.u || ''), ig = /instagram\.com/.test(share.u || '');
      inner += `<div class="card">` +
        (share.o ? `<div class="top"><i></i>${esc(share.o)}</div>` : `<div class="kind">${isReel ? 'Reel' : 'Shared post'}</div>`) +
        (share.c ? `<div class="cap">${esc(share.c)}</div>` : '') +
        (share.u ? `<a class="open-ig" href="${esc(share.u)}" target="_blank" rel="noopener">${ig ? (isReel ? '▶ Watch reel' : 'Open on Instagram') : 'Open link'}</a>` : '') +
        `</div>`;
    }
    const reacts = (m.r || []).map(r => (r.match(/^\P{L}+/u) || [''])[0].trim()).join('');
    html += `<div class="row${me ? ' me' : ''}${first ? ' first' : ''}${last ? ' last' : ''}" data-i="${m.idx}">` +
      (first && !me ? `<div class="name">${esc(m.s)}</div>` : '') + inner +
      (reacts ? `<div class="reacts" title="${esc((m.r || []).join(', '))}">${reacts}</div>` : '') +
      (last || reacts ? `<div class="meta">${time(m.t)}</div>` : '') + `</div>`;
  });
  html += `<div class="swipehint">Swipe ← → or use the arrows to change day</div>`;
  $('msgs').innerHTML = html;

  if (hitIdx != null) {
    const el = document.querySelector(`[data-i="${hitIdx}"]`);
    if (el) { el.classList.add('hit'); requestAnimationFrame(() => { el.scrollIntoView({ block: 'center' }); setTimeout(() => el.classList.add('fade'), 50); }); }
  } else window.scrollTo(0, 0);
}

$('msgs').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c && !e.target.closest('a')) c.classList.toggle('open');
});

const step = n => { const i = days.indexOf(cur) + n; if (i >= 0 && i < days.length) renderDay(days[i]); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if ($('sheet').classList.contains('show')) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});

// swipe between days
let sx = 0, sy = 0, st = 0;
const main = $('msgs');
main.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
main.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 600) step(dx < 0 ? 1 : -1);
}, { passive: true });

// calendar sheet
const counts = days.map(d => byDay.get(d).length).sort((a, b) => a - b);
const q = p => counts[Math.floor(p * (counts.length - 1))];
const T = [q(.25), q(.5), q(.8)];
function heat(n) { return n > T[2] ? 'h4' : n > T[1] ? 'h3' : n > T[0] ? 'h2' : ''; }

function buildCal() {
  const months = new Map();
  days.forEach(d => { const k = d.slice(0, 7); months.set(k, (months.get(k) || 0) + byDay.get(d).length); });
  let html = '';
  for (const [k, total] of months) {
    const [y, m] = k.split('-').map(Number);
    const first = new Date(y, m - 1, 1).getDay(), len = new Date(y, m, 0).getDate();
    const active = days.filter(d => d.startsWith(k)).length;
    html += `<section class="month" id="m-${k}"><h3>${MONL[m - 1]} ${y}<span>${active} day${active > 1 ? 's' : ''} · ${total} msgs</span></h3><div class="grid">`;
    html += DOW.map(d => `<div class="dow">${d[0]}</div>`).join('');
    for (let i = 0; i < first; i++) html += '<div></div>';
    for (let dd = 1; dd <= len; dd++) {
      const key = `${k}-${String(dd).padStart(2, '0')}`, n = byDay.get(key)?.length;
      html += n ? `<button class="d has ${heat(n)}" data-day="${key}" aria-label="${short(key)}, ${n} messages">${dd}<small>${n}</small></button>`
                : `<div class="d">${dd}</div>`;
    }
    html += '</div></section>';
  }
  html += `<div class="legend">fewer <i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-4)"></i> more</div>`;
  $('cal').innerHTML = html;
}
buildCal();

function openSheet() {
  document.querySelectorAll('.d.cur').forEach(e => e.classList.remove('cur'));
  const c = document.querySelector(`.d[data-day="${cur}"]`); if (c) c.classList.add('cur');
  $('sheet').classList.add('show'); $('sheet').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  const sec = $('m-' + cur.slice(0, 7));
  if (sec && !$('q').value) $('sheetBody').scrollTop = sec.offsetTop - 8;
}
function closeSheet() {
  $('sheet').classList.remove('show'); $('sheet').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = ''; $('q').blur();
}
$('openSheet').onclick = openSheet;
$('closeSheet').onclick = closeSheet;
$('sheet').addEventListener('click', e => {
  const d = e.target.closest('[data-day]');
  if (d) { renderDay(d.dataset.day, d.dataset.i != null ? +d.dataset.i : null); closeSheet(); return; }
  const g = e.target.closest('[data-go]');
  if (g) {
    const go = g.dataset.go;
    const day = go === 'first' ? days[0] : go === 'last' ? days.at(-1)
      : go === 'busiest' ? days.reduce((a, b) => byDay.get(b).length > byDay.get(a).length ? b : a)
      : days[Math.floor(Math.random() * days.length)];
    renderDay(day); closeSheet();
  }
});

// search
const searchable = msgs.map(m => [m.x && !/ sent an attachment\.$/.test(m.x) ? m.x : '', m.sh?.c || '', m.sh?.o || ''].join(' ').toLowerCase());
let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 120); });
$('clr').onclick = () => { $('q').value = ''; runSearch(); $('q').focus(); };
function runSearch() {
  const term = $('q').value.trim().toLowerCase();
  $('searchWrap').classList.toggle('has', !!term);
  $('cal').hidden = !!term; $('results').hidden = !term;
  if (!term) return;
  const hits = [];
  searchable.forEach((s, i) => { if (s.includes(term)) hits.push(msgs[i]); });
  const rx = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const shown = hits.slice().reverse().slice(0, 200);
  $('results').innerHTML = (hits.length ? `<div class="count">${hits.length} result${hits.length > 1 ? 's' : ''}${hits.length > 200 ? ' · showing latest 200' : ''}</div>` : '<div class="empty">No messages found</div>') +
    shown.map(m => {
      const raw = (m.x && !/ sent an attachment\.$/.test(m.x) ? m.x : m.sh?.c || m.sh?.o || '');
      const pos = raw.toLowerCase().indexOf(term);
      const snip = pos > 60 ? '…' + raw.slice(pos - 40) : raw;
      return `<button class="res" data-day="${m.t.slice(0, 10)}" data-i="${m.idx}"><div class="when"><span>${esc(m.s)}</span><span>${short(m.t.slice(0, 10))} · ${time(m.t)}</span></div><div class="txt">${esc(snip).replace(rx, x => `<mark>${x}</mark>`)}</div></button>`;
    }).join('');
  $('sheetBody').scrollTop = 0;
}

// start
let start = location.hash.slice(1);
if (!byDay.has(start)) { try { start = localStorage.getItem('chatDay'); } catch (e) { start = null; } }
if (!byDay.has(start)) start = days.at(-1);
renderDay(start);
